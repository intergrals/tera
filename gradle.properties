org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# File-system watching is unreliable in restricted environments and unnecessary here.
org.gradle.vfs.watch=false
# Run the Kotlin/KSP compilers inside the Gradle JVM: separate compiler daemons can hang
# in sandboxed/CI environments, and this project is small enough that in-process is fast.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
